name: Build & Release Desktop App

# HOW TO USE
# ----------
# Every push to `main`:
#   - builds Windows (NSIS .exe + latest.yml) and Linux (.deb + AppImage
#     + latest-linux.yml) Electron apps.
#   - builds an Android APK via Capacitor and uploads it to the same
#     GitHub Release as clinical-rx-<version>.apk (sideload on phone).
#   - publishes assets to a real GitHub Release (not draft/prerelease),
#     which is what the in-app "🔄 Update" button reads.
# Bump "version" in package.json to make the in-app updater fire.

on:
  push:
    branches: [main, arena/*]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    # PRs / non-main branches: build only, upload artifacts (no release).
    if: github.ref != 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild native modules
        if: runner.os == 'Linux' || runner.os == 'Windows'
        run: npm rebuild better-sqlite3 --build-from-source

      - name: Type-check
        run: npm run typecheck

      - name: Build renderer (web build)
        run: npm run build:web

      - name: Build Electron main process
        run: npm run build:electron

      - name: Package Electron app
        run: npm run dist -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ----- Android APK (ubuntu leg only) -----
      - name: Set up JDK 17
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK cmdline-tools
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -eux
          ANDROID_HOME=${ANDROID_HOME:-$HOME/android-sdk}
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            CMDTOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            curl -fsSL "$CMDTOOLS_URL" -o /tmp/cmdtools.zip
            unzip -q -o /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"
          echo "--- installed packages ---"
          sdkmanager --list_installed | grep -E 'platform-tools|platforms;android-34|build-tools;34.0.0'

      - name: Sync Capacitor web assets
        if: matrix.os == 'ubuntu-latest'
        run: npx cap sync android

      - name: Build Android APK (debug, installable)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: clinical-rx-android-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Upload Electron artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clinical-rx-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.yml
          if-no-files-found: warn

  release:
    name: Release ${{ matrix.os }}
    # Push to main: build AND publish a GitHub Release automatically.
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild native modules
        if: runner.os == 'Linux' || runner.os == 'Windows'
        run: npm rebuild better-sqlite3 --build-from-source

      - name: Type-check
        run: npm run typecheck

      - name: Build renderer (web build)
        run: npm run build:web

      - name: Build Electron main process
        run: npm run build:electron

      - name: Build & publish desktop app to GitHub Releases
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_GH_IGNORE_TIME: 'true'

      # ----- Android APK (ubuntu leg only) -----
      - name: Set up JDK 17
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK cmdline-tools
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -eux
          ANDROID_HOME=${ANDROID_HOME:-$HOME/android-sdk}
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            CMDTOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            curl -fsSL "$CMDTOOLS_URL" -o /tmp/cmdtools.zip
            unzip -q -o /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"
          echo "--- installed packages ---"
          sdkmanager --list_installed | grep -E 'platform-tools|platforms;android-34|build-tools;34.0.0'

      - name: Build Android APK
        if: matrix.os == 'ubuntu-latest'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          npx cap sync android
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release-keystore.p12
            echo "Keystore injected — release APK will be signed."
          else
            echo "No keystore secret — building debug APK (installable)."
          fi
          cd android
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            ./gradlew assembleRelease --no-daemon
            APK_SRC=$(ls app/build/outputs/apk/release/app-release.apk 2>/dev/null || true)
          else
            ./gradlew assembleDebug --no-daemon
            APK_SRC=$(ls app/build/outputs/apk/debug/app-debug.apk 2>/dev/null || true)
          fi
          echo "APK_SRC=$APK_SRC" >> "$GITHUB_ENV"

      - name: Upload Android APK to release
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if [ -z "${APK_SRC:-}" ] || [ ! -f "$APK_SRC" ]; then
            echo "No APK built; skipping upload."
            exit 0
          fi
          cp "$APK_SRC" "clinical-rx-$VERSION.apk"
          echo "Uploading clinical-rx-$VERSION.apk to $TAG ..."
          gh release upload "$TAG" "clinical-rx-$VERSION.apk" --clobber 2>/dev/null \
            || gh release create "$TAG" "clinical-rx-$VERSION.apk" --title "ClinicalRx $VERSION" --notes "Android APK for $VERSION" \
            || echo "Upload failed (release busy) — will retry on next push."