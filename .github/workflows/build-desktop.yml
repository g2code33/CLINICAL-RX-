name: Build & Release Desktop App

on:
  push:
    branches: [main, arena/*]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    if: github.ref != 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build renderer (web build)
        run: npm run build:web

      - name: Build Electron main process
        run: npm run build:electron

      - name: Package Electron app
        run: npm run dist -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ----- Android APK (ubuntu leg only) -----
      - name: Set up JDK 17
        if: runner.os == 'Linux'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        if: runner.os == 'Linux'
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 platforms;android-34 build-tools;34.0.0

      - name: Sync Capacitor web assets
        if: runner.os == 'Linux'
        run: npx cap sync android

      - name: Build Android APK (debug)
        if: runner.os == 'Linux'
        run: |
          cd android
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties && cat local.properties && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Android APK artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: clinical-rx-android-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Upload Electron artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clinical-rx-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.yml
          if-no-files-found: warn

  release:
    name: Release ${{ matrix.os }}
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build renderer (web build)
        run: npm run build:web

      - name: Build Electron main process
        run: npm run build:electron

      - name: Build & publish desktop app to GitHub Releases
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EP_GH_IGNORE_TIME: 'true'

      # ----- Android APK (ubuntu leg only) -----
      - name: Set up JDK 17
        if: runner.os == 'Linux'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        if: runner.os == 'Linux'
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 platforms;android-34 build-tools;34.0.0

      - name: Build Android APK
        if: runner.os == 'Linux'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          npx cap sync android
          cd android
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release-keystore.p12
            echo "Keystore injected — building release APK."
            echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties && cat local.properties && ./gradlew assembleRelease --no-daemon --stacktrace
            APK_SRC=$(ls app/build/outputs/apk/release/app-release.apk 2>/dev/null || true)
          else
            echo "No keystore secret — building debug APK."
            echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties && cat local.properties && ./gradlew assembleDebug --no-daemon --stacktrace
            APK_SRC=$(ls app/build/outputs/apk/debug/app-debug.apk 2>/dev/null || true)
          fi
          echo "APK_SRC=$APK_SRC" >> "$GITHUB_ENV"

      - name: Upload Android APK to release
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if [ -z "${APK_SRC:-}" ] || [ ! -f "$APK_SRC" ]; then
            echo "No APK built; skipping upload."
            exit 0
          fi
          cp "$APK_SRC" "clinical-rx-$VERSION.apk"
          echo "Uploading clinical-rx-$VERSION.apk to $TAG ..."
          gh release upload "$TAG" "clinical-rx-$VERSION.apk" --clobber 2>/dev/null \
            || gh release create "$TAG" "clinical-rx-$VERSION.apk" --title "ClinicalRx $VERSION" --notes "Android APK for $VERSION" \
            || echo "Upload failed (release busy) — will retry on next push."
